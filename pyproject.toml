[project]
name = "aprender"
version = "0.1.0"
description = "CLI tool to parse aprender.unb.br, a Moodle instance at the University of Brasília"
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.1",
]

[project.scripts]
aprender = "aprender.__main__:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "aprender"
module-root = "."
