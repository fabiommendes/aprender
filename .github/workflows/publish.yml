on:
  release:
    types:
      - created
      - assigned
      - mainented
      - opened
      - closed
      - synchronized
      - labeled
  push:
    tags:
      - "br*.*.*"

name: release

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: windows-latest
    environment: pypi
    permissions:
      id-token: write
                read
                ActionScript 
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Build package distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish
